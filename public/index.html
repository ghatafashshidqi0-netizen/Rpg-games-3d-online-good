<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eclipse Realms - 3D Online Action MMORPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0b10;
      color: #fff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      touch-action: auto;
    }

    .menu-box {
      background: #151522;
      border: 2px solid #4a3b8c;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 30px rgba(74, 59, 140, 0.5);
      width: 350px;
    }

    .menu-box h1 {
      font-size: 2.2rem;
      color: #c792ea;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .menu-box p {
      color: #8f93a2;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    .menu-box input {
      width: 100%;
      padding: 12px;
      background: #0b0b10;
      border: 1px solid #3a3f58;
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .primary-btn {
      background: linear-gradient(135deg, #7c4dff, #512da8);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(124, 77, 255, 0.4);
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #player-status {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid #3a3f58;
      padding: 15px;
      border-radius: 8px;
      width: 220px;
      pointer-events: auto;
    }

    .name-display {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffcb6b;
      font-size: 1.05rem;
    }

    .bar-container {
      position: relative;
      width: 100%;
      height: 16px;
      background: #0b0b10;
      border-radius: 4px;
      margin-bottom: 6px;
      overflow: hidden;
      border: 1px solid #2a2f45;
    }

    .bar {
      height: 100%;
      transition: width 0.3s ease;
    }

    .hp-bar { background: #f07178; width: 100%; }
    .mana-bar { background: #82aaff; width: 100%; }

    .bar-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-size: 10px;
      text-align: center;
      line-height: 14px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    #minimap {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 150px;
      height: 150px;
      background: rgba(15, 15, 25, 0.85);
      border: 2px solid #3a3f58;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: auto;
    }

    /* Virtual Joystick Styles */
    #joystick-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 130px;
      height: 130px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      pointer-events: auto;
      display: none; /* Enabled via script if touch is detected or always on mobile */
      touch-action: none;
    }

    #joystick-handle {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 60px;
      height: 60px;
      background: rgba(124, 77, 255, 0.6);
      border: 2px solid #c792ea;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Mobile Action Buttons */
    #action-buttons {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: none;
      gap: 15px;
      pointer-events: auto;
    }

    .mob-btn {
      width: 65px;
      height: 65px;
      background: rgba(20, 20, 35, 0.85);
      border: 2px solid #4a3b8c;
      border-radius: 50%;
      color: #c792ea;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .mob-btn:active {
      background: #7c4dff;
      color: #fff;
    }

    #skill-hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .slot {
      width: 50px;
      height: 50px;
      background: rgba(20, 20, 35, 0.9);
      border: 2px solid #4a3b8c;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #c792ea;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      font-size: 0.85rem;
    }

    .slot span {
      font-size: 0.65rem;
      color: #8f93a2;
      margin-top: 1px;
    }

    .hidden { display: none !important; }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- In-Game HUD Interface -->
  <div id="hud" class="hidden">
    <div id="player-status">
      <div class="name-display" id="char-name">Hero</div>
      <div class="bar-container">
        <div class="bar hp-bar" id="hp-bar-fill"></div>
        <span class="bar-text" id="hp-text">100 / 100</span>
      </div>
      <div class="bar-container">
        <div class="bar mana-bar" id="mana-bar-fill"></div>
        <span class="bar-text" id="mana-text">50 / 50</span>
      </div>
    </div>

    <!-- Minimap Placeholder -->
    <div id="minimap">
      <canvas id="minimap-canvas" width="150" height="150"></canvas>
    </div>

    <!-- Virtual Joystick Container -->
    <div id="joystick-container">
      <div id="joystick-handle"></div>
    </div>

    <!-- Mobile Action Buttons -->
    <div id="action-buttons">
      <div class="mob-btn" id="btn-attack">⚔️</div>
      <div class="mob-btn" id="btn-jump">⬆️</div>
    </div>

    <!-- Skill Hotbar -->
    <div id="skill-hotbar">
      <div class="slot">⚔️<span>[1]</span></div>
      <div class="slot">🔥<span>[2]</span></div>
      <div class="slot">❄️<span>[3]</span></div>
      <div class="slot">⚡<span>[4]</span></div>
    </div>
  </div>

  <!-- Main Menu Overlay -->
  <div id="main-menu" class="overlay">
    <div class="menu-box">
      <h1>ECLIPSE REALMS</h1>
      <p>3D Online Action MMORPG</p>
      <input type="text" id="username-input" placeholder="Enter Hero Name" value="Wanderer" maxlength="20">
      <button id="play-btn" class="primary-btn">ENTER ELDORIA</button>
    </div>
  </div>

  <!-- Integrated Game Engine Script -->
  <script>
    class World {
      constructor(scene) {
        this.scene = scene;
        this.buildEldoria();
      }

      buildEldoria() {
        const groundGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ 
          color: 0x2e4f3f, 
          roughness: 0.8,
          metalness: 0.2 
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        this.scene.add(ground);

        for (let i = 0; i < 50; i++) {
          const x = (Math.random() - 0.5) * 250;
          const z = (Math.random() - 0.5) * 250;
          if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
          this.createTree(x, z);
        }
      }

      createTree(x, z) {
        const treeGroup = new THREE.Group();
        const trunkGeo = new THREE.CylinderGeometry(0.6, 0.8, 4, 6);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 2;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        const leavesGeo = new THREE.ConeGeometry(2.5, 6, 6);
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 5.5;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        treeGroup.position.set(x, 0, z);
        this.scene.add(treeGroup);
      }
    }

    class Player {
      constructor(scene, name) {
        this.scene = scene;
        this.name = name;
        this.keys = {};
        this.speed = 8.0;
        this.joystickVector = new THREE.Vector2(0, 0);

        this.createAvatar();
        this.initInputListeners();
        this.initVirtualJoystick();
      }

      createAvatar() {
        const group = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(0.8, 1.4, 0.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.6, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.0;
        body.castShadow = true;
        group.add(body);

        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.95;
        head.castShadow = true;
        group.add(head);

        const swordGeo = new THREE.BoxGeometry(0.1, 1.2, 0.2);
        const swordMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.9, roughness: 0.1 });
        const sword = new THREE.Mesh(swordGeo, swordMat);
        sword.position.set(0.6, 1.0, 0.2);
        sword.rotation.x = Math.PI / 4;
        group.add(sword);

        this.mesh = group;
        this.scene.add(this.mesh);
      }

      initInputListeners() {
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      }

      initVirtualJoystick() {
        const container = document.getElementById('joystick-container');
        const handle = document.getElementById('joystick-handle');
        
        // Show touch controls if mobile or touch device detected
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          container.style.display = 'block';
          document.getElementById('action-buttons').style.display = 'flex';
        }

        let activeTouchId = null;
        const maxDist = 35; // max radius distance for joystick handle

        container.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.changedTouches[0];
          activeTouchId = touch.identifier;
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
          if (activeTouchId === null) return;
          for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            if (touch.identifier === activeTouchId) {
              const rect = container.getBoundingClientRect();
              const centerX = rect.left + rect.width / 2;
              const centerY = rect.top + rect.height / 2;

              let dx = touch.clientX - centerX;
              let dy = touch.clientY - centerY;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
              }

              handle.style.transform = `translate(${dx}px, ${dy}px)`;
              
              // Normalize output vector (-1 to 1)
              this.joystickVector.set(dx / maxDist, dy / maxDist);
            }
          }
        }, { passive: false });

        const endTouchHandler = (e) => {
          if (activeTouchId === null) return;
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === activeTouchId) {
              activeTouchId = null;
              handle.style.transform = `translate(0px, 0px)`;
              this.joystickVector.set(0, 0);
            }
          }
        };

        window.addEventListener('touchend', endTouchHandler);
        window.addEventListener('touchcancel', endTouchHandler);
      }

      update(delta) {
        const moveDir = new THREE.Vector3();

        // Keyboard Input (WASD / Arrows)
        if (this.keys['KeyW'] || this.keys['ArrowUp']) moveDir.z -= 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) moveDir.z += 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveDir.x -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) moveDir.x += 1;

        // Combine with Virtual Joystick input if active
        if (this.joystickVector.lengthSq() > 0) {
          moveDir.x += this.joystickVector.x;
          moveDir.z += this.joystickVector.y;
        }

        if (moveDir.lengthSq() > 0) {
          if (moveDir.lengthSq() > 1) moveDir.normalize();
          this.mesh.position.addScaledVector(moveDir, this.speed * delta);
          this.mesh.rotation.y = Math.atan2(moveDir.x, moveDir.z);

          if (window.game && window.game.multiplayer) {
            window.game.multiplayer.sendMovement({
              x: this.mesh.position.x,
              y: this.mesh.position.y,
              z: this.mesh.position.z,
              rotY: this.mesh.rotation.y
            });
          }
        }
      }
    }

    class MultiplayerManager {
      constructor(scene, player) {
        this.scene = scene;
        this.localPlayer = player;
        this.socket = io();
        this.remotePlayers = {};

        this.initSocketEvents();
      }

      initSocketEvents() {
        this.socket.on('currentPlayers', (players) => {
          Object.keys(players).forEach((id) => {
            if (id === this.socket.id) return;
            this.addRemotePlayer(players[id]);
          });
        });

        this.socket.on('playerJoined', (playerData) => {
          this.addRemotePlayer(playerData);
        });

        this.socket.on('playerMoved', (playerData) => {
          if (this.remotePlayers[playerData.id]) {
            const p = this.remotePlayers[playerData.id];
            p.position.set(playerData.x, playerData.y, playerData.z);
            p.rotation.y = playerData.rotY;
          }
        });

        this.socket.on('playerDisconnected', (id) => {
          if (this.remotePlayers[id]) {
            this.scene.remove(this.remotePlayers[id]);
            delete this.remotePlayers[id];
          }
        });
      }

      addRemotePlayer(data) {
        const group = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.4, 0.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3182ce, metalness: 0.5, roughness: 0.4 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.0;
        group.add(body);

        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.95;
        group.add(head);

        group.position.set(data.x, data.y, data.z);
        this.scene.add(group);
        this.remotePlayers[data.id] = group;
      }

      sendMovement(data) {
        this.socket.emit('playerMovement', data);
      }
    }

    class GameApp {
      constructor() {
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.world = null;
        this.player = null;
        this.multiplayer = null;
        this.clock = new THREE.Clock();

        this.initUI();
      }

      initUI() {
        const playBtn = document.getElementById('play-btn');
        const usernameInput = document.getElementById('username-input');
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');

        playBtn.addEventListener('click', () => {
          const username = usernameInput.value.trim() || 'Hero';
          document.getElementById('char-name').textContent = username;
          mainMenu.classList.add('hidden');
          hud.classList.remove('hidden');
          this.initEngine(username);
        });
      }

      initEngine(username) {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0b0b15);
        this.scene.fog = new THREE.FogExp2(0x0b0b15, 0.015);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        document.body.appendChild(this.renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        this.scene.add(dirLight);

        this.world = new World(this.scene);
        this.player = new Player(this.scene, username);
        this.multiplayer = new MultiplayerManager(this.scene, this.player);

        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        this.animate();
      }

      animate = () => {
        requestAnimationFrame(this.animate);

        const delta = this.clock.getDelta();

        if (this.player) {
          this.player.update(delta);

          const idealOffset = new THREE.Vector3(0, 4, -8).applyQuaternion(this.player.mesh.quaternion);
          const idealLookat = this.player.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));

          this.camera.position.lerp(this.player.mesh.position.clone().add(idealOffset), 0.1);
          this.camera.lookAt(idealLookat);
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.game = new GameApp();
    });
  </script>
</body>
</html>
